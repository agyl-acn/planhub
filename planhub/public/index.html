<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F2">
<title>Planhub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="28" cy="12" r="5" fill="#F48FB1" opacity=".8"/><path d="M2 32c6-9 12-12 18-8s10 2 18-4v16H2z" fill="#7CB342" opacity=".75"/><path d="M8 36c4-4 8-5 12-3s8 1 12-3" stroke="#212635" stroke-width="1.6" fill="none" stroke-dasharray="2 3" stroke-linecap="round"/></svg>
      Planhub
    </div>
    <a href="#/today" data-nav="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</a>
    <a href="#/kpi" data-nav="kpi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4c3-1.5 5 1.5 8 0s4-1 6 0v9c-2-1-3-1.5-6 0s-5-1.5-8 0"/></svg>KPI</a>
    <a href="#/projects" data-nav="projects"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16"/></svg>Projects</a>
    <a href="#/dump" data-nav="dump"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-8A5.5 5.5 0 0 1 17 9a3.5 3.5 0 0 1 .5 9z"/></svg>Mind dump<span class="count" data-count="dump"></span></a>
    <a href="#/calendar" data-nav="calendar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendar</a>
    <a href="#/time" data-nav="time"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</a>
    <div class="nav-foot">
      <button class="btn ghost sm" id="export" type="button">Export backup</button>
      <label class="btn ghost sm" style="display:inline-flex">Import backup<input id="import" type="file" accept="application/json" hidden></label>
    </div>
  </nav>
  <main>
    <div class="timerbar" id="timerbar" role="status"><span class="pulse"></span><span class="what"></span><span class="clock"></span>
      <button class="btn light sm" data-stop type="button">Stop</button></div>
    <div id="view" class="view"></div>
  </main>
</div>
<nav class="mobile-nav" aria-label="Main mobile">
  <a href="#/today" data-nav="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Today</a>
  <a href="#/kpi" data-nav="kpi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4c3-1.5 5 1.5 8 0s4-1 6 0v9c-2-1-3-1.5-6 0s-5-1.5-8 0"/></svg>KPI</a>
  <a href="#/projects" data-nav="projects"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16"/></svg>Projects</a>
  <a href="#/dump" data-nav="dump"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-8A5.5 5.5 0 0 1 17 9a3.5 3.5 0 0 1 .5 9z"/></svg>Dump</a>
  <a href="#/calendar" data-nav="calendar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendar</a>
  <a href="#/time" data-nav="time"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</a>
</nav>
<dialog id="dlg"><form method="dialog"></form></dialog>
<script src="/app.js"></script>
</body>
</html>
